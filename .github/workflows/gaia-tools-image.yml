# gaia-tools-image — build + publish the bundled deterministic-tools image.
#
# Publishes
# `ghcr.io/gaiastudio-ai/gaia-tools:<version>-<db-date>` for multi-arch
# (amd64 + arm64) so /gaia-doctor's `runner: docker` mode resolves
# Tier 2 tools from a single pinned image rather than asking each
# adopter to install grype + syft + spotbugs + … by hand.
#
# Triggers:
#   - push to main when the image source changes (manual rebuilds via UI too).
#   - monthly cron for vuln-DB freshness (1st of each month).
#   - workflow_dispatch for ad-hoc rebuilds.

name: gaia-tools-image

on:
  push:
    branches: [main]
    paths:
      - 'plugins/gaia/tools/gaia-tools/**'
      - '.github/workflows/gaia-tools-image.yml'
  schedule:
    # Monthly cadence for Grype DB freshness — 04:00 UTC on the 1st.
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override GAIA_TOOLS_VERSION tag (default: from Dockerfile ARG default)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write          # required for ghcr push

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: |
          # Image tag shape: ghcr.io/<owner>/gaia-tools:<version>-<db-date>
          # Version comes from the Dockerfile ARG default unless overridden via
          # workflow_dispatch input; db-date is today's UTC date.
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -E '^ARG GAIA_TOOLS_VERSION=' plugins/gaia/tools/gaia-tools/Dockerfile | head -1 | sed -E 's/^ARG GAIA_TOOLS_VERSION=([0-9.]+).*$/\1/')
          fi
          DB_DATE=$(date -u +%Y-%m-%d)
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          BASE="ghcr.io/${OWNER_LC}/gaia-tools"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "db_date=${DB_DATE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${BASE}:${VERSION}-${DB_DATE}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "image_version_latest=${BASE}:${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: plugins/gaia/tools/gaia-tools
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tag.outputs.image_tag }}
            ${{ steps.tag.outputs.image_version_latest }}
            ${{ steps.tag.outputs.image_latest }}
          build-args: |
            GAIA_TOOLS_VERSION=${{ steps.tag.outputs.version }}
            GAIA_TOOLS_DB_DATE=${{ steps.tag.outputs.db_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image (amd64)
        run: |
          set -euo pipefail
          IMG="${{ steps.tag.outputs.image_tag }}"
          docker pull --platform linux/amd64 "$IMG"
          docker run --platform linux/amd64 --rm "$IMG" --version
          docker run --platform linux/amd64 --rm "$IMG" --bom

          # Probe each bundled tool reports a version. A probe failure
          # stops the build — no tool may be silently absent.
          PROBE_FAIL=0
          for t in grype syft osv-scanner semgrep checkov cppcheck gitleaks vulture pip-audit cyclonedx-bom cdxgen yamllint yq; do
            echo "::group::probe $t"
            if ! docker run --platform linux/amd64 --rm "$IMG" "$t" --version 2>&1; then
              if ! docker run --platform linux/amd64 --rm "$IMG" "$t" version 2>&1; then
                echo "::error::probe failed: $t"
                PROBE_FAIL=1
              fi
            fi
            echo "::endgroup::"
          done
          if [ "$PROBE_FAIL" -ne 0 ]; then
            echo "::error::one or more tool probes failed"
            exit 1
          fi

          # Post-build version comparison: verify each scanner's reported
          # version matches the pin manifest (exact, not major-only).
          echo "::group::version-pin-check"
          BOM="$(docker run --platform linux/amd64 --rm "$IMG" --bom)"
          MANIFEST="plugins/gaia/tools/gaia-tools/scanner-manifest.json"
          # Normalise a version string for comparison: strip leading v,
          # split on dots, compare as integers, trailing .0 segments ignored.
          _norm_ver() {
            local v="${1#v}"
            printf '%s' "$v"
          }
          _ver_equal() {
            local a; a="$(_norm_ver "$1")"
            local b; b="$(_norm_ver "$2")"
            # Split into dot-separated arrays and compare numerically,
            # treating missing trailing components as 0.
            local IFS=.
            set -- $a; local -a aa=("$@")
            set -- $b; local -a bb=("$@")
            local max=${#aa[@]}; [ "${#bb[@]}" -gt "$max" ] && max=${#bb[@]}
            local i
            for (( i=0; i<max; i++ )); do
              local ca="${aa[$i]:-0}"
              local cb="${bb[$i]:-0}"
              [ "$ca" -eq "$cb" ] 2>/dev/null || return 1
            done
            return 0
          }
          ERRORS=0
          while read -r name ver; do
            case "$name" in Sarif.Multitool) name_lc="sarif" ;; *) name_lc="$name" ;; esac
            reported="$(echo "$BOM" | grep -i "$name_lc" | awk '{print $NF}')" || reported=""
            if [ -z "$reported" ] || [ "$reported" = "unknown" ]; then
              echo "::error::$name: version not reported in BOM (expected $ver)"
              ERRORS=1
              continue
            fi
            if ! _ver_equal "$reported" "$ver"; then
              echo "::error::$name version mismatch: manifest=$ver, image=$reported"
              ERRORS=1
            fi
          done < <(jq -r '.scanners[] | "\(.name) \(.version)"' "$MANIFEST")
          if [ "$ERRORS" -ne 0 ]; then exit 1; fi
          echo "::endgroup::"

      - name: Summary
        run: |
          {
            echo "## gaia-tools image published"
            echo ""
            echo "- \`${{ steps.tag.outputs.image_tag }}\`"
            echo "- \`${{ steps.tag.outputs.image_version_latest }}\`"
            echo "- \`${{ steps.tag.outputs.image_latest }}\`"
            echo ""
            echo "Multi-arch: linux/amd64 + linux/arm64."
            echo ""
            echo "### Pull"
            echo ""
            echo "    docker pull ${{ steps.tag.outputs.image_tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
