name: plugin-ci

# Prior config triggered on PRs to `main` only, so the `bats-tests` job
# never ran on staging -> main sequences and the coverage wrapper's silent
# abort stayed hidden. Path filter `plugins/gaia/**` keeps noise low by
# scoping to the product source surface the wrapper actually guards.
# Triggered on PRs only. The PR (pull_request) event gates every change before
# it lands — including the staging->main promotion PR, where the promotion
# full-suite escalation reads the PR's base.ref. The old `push:` trigger re-ran
# the entire suite a SECOND time on the post-merge commit (feature->staging AND
# staging->main), duplicating ~16 min of bats per story for no added safety on a
# squash-merge flow. Dropped to remove that duplication. (Release tag/publish is
# command-driven via /gaia-release + /gaia-publish; it never depended on this.)
on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'plugins/gaia/**'
      - '.github/workflows/plugin-ci.yml'
      - '.github/bats-shard-assignments.tsv'
      - '.github/scripts/**'
      - 'profiling/**'
      - 'scripts/audit-v2-migration.sh'
      - 'tests/**'

# Cancel superseded runs on the same PR branch.  Each PR branch gets its own
# concurrency group so a force-push cancels only the stale run for THAT branch,
# never a run for another PR or a dependent workflow.  The `cancel-in-progress`
# flag is safe here because no other workflow `needs:` these jobs — they are
# leaf checks consumed only by branch-protection status requirements.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- diff-based check selection (determines which jobs to run) ----------
  diff-classify:
    name: diff-classify
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      # 'code' when the diff touches .sh, .bats, .yml, .yaml, or workflow files;
      # 'docs-only' when the diff touches exclusively markdown under docs/ or
      # documentation/. Jobs that are expensive (macOS runner) gate on this.
      change_type: ${{ steps.classify.outputs.change_type }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        run: |
          set -euo pipefail
          # Compute the diff against the PR base. GITHUB_BASE_REF is set for
          # pull_request events; fall back to origin/staging for manual runs.
          base_ref="${GITHUB_BASE_REF:-staging}"
          changed="$(git diff --name-only "origin/${base_ref}...HEAD" 2>/dev/null || true)"
          if [ -z "$changed" ]; then
            echo "change_type=code" >> "$GITHUB_OUTPUT"
            echo "::notice::No diff found or merge-base unavailable; defaulting to full check set"
            exit 0
          fi

          echo "::group::Changed files"
          echo "$changed"
          echo "::endgroup::"

          # Check whether any changed file is NOT a pure doc file.
          # Docs-only = all changed files match docs/**/*.md or documentation/**/*.md
          has_code="false"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/*.md|documentation/*.md) ;;  # docs — skip
              *.sh|*.bats|*.yml|*.yaml)         has_code="true"; break ;;
              .github/*|plugins/gaia/*|tests/*|scripts/*) has_code="true"; break ;;
              *)                                has_code="true"; break ;;
            esac
          done <<< "$changed"

          if [ "$has_code" = "true" ]; then
            echo "change_type=code" >> "$GITHUB_OUTPUT"
            echo "::notice::Diff contains code/test/config files; full check set selected"
          else
            echo "change_type=docs-only" >> "$GITHUB_OUTPUT"
            echo "::notice::Diff is docs-only; macOS and heavy jobs will be skipped"
          fi

  frontmatter-lint:
    name: frontmatter-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
      - name: Lint SKILL.md frontmatter
        run: .github/scripts/lint-skill-frontmatter.sh
      - name: Lint agent frontmatter
        run: .github/scripts/lint-agent-frontmatter.sh

  # ---------------------------------------------------------------------------
  # Fast-feedback: diff-selected tests report within minutes.
  # This is NOT a substitute for the full regression suite — it gives early
  # signal while the sharded suite runs in parallel.  The PR cannot merge
  # until the full `bats-tests` gate also passes.
  # ---------------------------------------------------------------------------
  bats-fast-feedback:
    name: bats-fast-feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          # Need full history to diff against the base branch.
          fetch-depth: 0
      - uses: mig4/setup-bats@af9a00deb21b5d795cabfeaa8d9060410377686d  # v1.2.0
        with:
          bats-version: 1.10.0
      - name: Install jq, python3, and the YAML/JSON-schema backends
        run: |
          sudo apt-get update && sudo apt-get install -y jq python3 python3-pip
          python3 -m pip install --break-system-packages PyYAML jsonschema
      - name: Select and run diff-focused tests
        env:
          BATS_FILTER_TAGS: '!hardware-dependent'
        run: |
          set -euo pipefail
          selected=$(.github/scripts/diff-select-tests.sh "origin/${{ github.base_ref }}" || true)
          if [ -z "$selected" ]; then
            echo "No diff-selected tests to run."
            echo "## Fast feedback" >> "$GITHUB_STEP_SUMMARY"
            echo "No test files matched the changed files." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(echo "$selected" | wc -l | tr -d ' ')
          echo "Running $count diff-selected test file(s):"
          echo "$selected"
          echo ""
          # shellcheck disable=SC2086
          bats --filter-tags '!hardware-dependent' $selected
          echo "## Fast feedback" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran **$count** diff-selected test file(s) -- all passed." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Sharded bats suite: 4 balanced shards run in parallel on separate runners.
  # Each shard runs a disjoint subset of the top-level .bats files, assigned by
  # .github/bats-shard-assignments.tsv (generated by rebalance-shards.sh from
  # per-file test counts or profiling data).
  #
  # Isolation: each shard runs on its own runner with its own filesystem, so
  # temp dirs, fixtures, and state files are inherently isolated.  No shared
  # /tmp/gaia-* paths between shards.
  # ---------------------------------------------------------------------------
  bats-shard:
    name: bats-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Profiling shows each shard runs ~3200 tests.  With --jobs 2 the expected
    # wall clock per shard is ~5 minutes (the monolithic 13000-test suite ran
    # in ~19 min with --jobs 2; each quarter should run ~5 min).  The 12-minute
    # timeout gives >50% headroom over the expected runtime.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
      - uses: mig4/setup-bats@af9a00deb21b5d795cabfeaa8d9060410377686d  # v1.2.0
        with:
          bats-version: 1.10.0
      - name: Install jq, GNU parallel, and the YAML/JSON-schema backends
        run: |
          sudo apt-get update && sudo apt-get install -y jq parallel python3 python3-pip
          python3 -m pip install --break-system-packages PyYAML jsonschema
      - name: Validate shard assignments (every .bats file must be assigned)
        run: .github/scripts/validate-shard-assignments.sh .
      - name: Run shard ${{ matrix.shard }}
        env:
          BATS_FILTER_TAGS: '!hardware-dependent'
          # Keep --jobs 2 per shard for the same reason as the monolithic job:
          # 2 concurrent files halves wall-clock without oversubscribing the
          # shared 4-core runner.
          BATS_JOBS: '2'
        run: |
          set -euo pipefail
          SHARD=${{ matrix.shard }}
          TESTS_DIR="plugins/gaia/tests"

          # Build the file list for this shard from the assignment file.
          FILES=()
          while IFS=$'\t' read -r s f _rest; do
            if [ "$s" = "$SHARD" ]; then
              FILES+=("$TESTS_DIR/$f")
            fi
          done < <(grep -v '^#' .github/bats-shard-assignments.tsv)

          echo "Shard $SHARD: ${#FILES[@]} files"
          start_epoch=$(date +%s)

          # Run with --jobs and --no-parallelize-within-files like the old
          # monolithic job.  GNU parallel must be present (installed above).
          bats --jobs "$BATS_JOBS" --no-parallelize-within-files \
            --filter-tags '!hardware-dependent' \
            "${FILES[@]}"

          end_epoch=$(date +%s)
          wall=$((end_epoch - start_epoch))

          echo "## Shard $SHARD" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran **${#FILES[@]}** files in **${wall}s** wall-clock." >> "$GITHUB_STEP_SUMMARY"

          # Record timing for the profiling artifact.
          mkdir -p profiling
          printf 'shard\tfiles\twall_seconds\n' > "profiling/shard-${SHARD}-timing.tsv"
          printf '%s\t%d\t%d\n' "$SHARD" "${#FILES[@]}" "$wall" >> "profiling/shard-${SHARD}-timing.tsv"
      - name: Upload shard timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}-timing
          path: profiling/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Gate job: passes only when ALL shards pass.  Runs the static coverage
  # check (public-function coverage, plugin validate, plugin mod tests) that
  # the old monolithic bats-tests job ran after its bats step.  Preserves the
  # `bats-tests` check name so branch-protection rules need no update.
  # ---------------------------------------------------------------------------
  bats-tests:
    name: bats-tests
    needs: [bats-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22.12'
      - name: Install Claude Code CLI (pinned version and lockfile integrity)
        env:
          CLAUDE_CODE_DISABLE_TELEMETRY: '1'
          NO_COLOR: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/claude-cli"
          cp .github/ci-tools/claude-cli/package.json .github/ci-tools/claude-cli/package-lock.json "$RUNNER_TEMP/claude-cli/"
          npm ci --prefix "$RUNNER_TEMP/claude-cli" --no-audit --no-fund
          echo "$RUNNER_TEMP/claude-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Download all shard timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*-timing
          path: profiling/
          merge-multiple: true
      - name: Merge profiling data and report
        run: |
          set -euo pipefail
          echo "## Shard timing summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shard | Files | Wall (s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|----------|" >> "$GITHUB_STEP_SUMMARY"
          total_wall=0
          max_wall=0
          for f in profiling/shard-*-timing.tsv; do
            [ -f "$f" ] || continue
            tail -1 "$f" | while IFS=$'\t' read -r s files wall; do
              echo "| $s | $files | $wall |" >> "$GITHUB_STEP_SUMMARY"
            done
            wall=$(tail -1 "$f" | cut -f3)
            total_wall=$((total_wall + wall))
            if [ "$wall" -gt "$max_wall" ]; then max_wall=$wall; fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Critical path (max shard): **${max_wall}s**" >> "$GITHUB_STEP_SUMMARY"
          echo "Sum of all shards: **${total_wall}s**" >> "$GITHUB_STEP_SUMMARY"
      - name: Assert public-function coverage (static check)
        run: .github/scripts/check-public-function-coverage.sh .
      - name: Validate plugin (strict mode)
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_DISABLE_TELEMETRY: '1'
          NO_COLOR: '1'
        run: claude plugin validate --strict plugins/gaia
      - name: Run plugin mod tests
        if: ${{ !cancelled() }}
        env:
          CLAUDE_CODE_DISABLE_TELEMETRY: '1'
          NO_COLOR: '1'
        run: claude plugin test plugins/gaia

  skills-bats-tests:
    # Wires the skill bats files into CI. Until this job landed, skill-level
    # bats files (e.g., the dev-story planning-gate regression suite) lived
    # only on disk and never gated PRs. The job covers the whole tests/skills
    # tree, top level and skill-scoped subdirectories alike; files that are
    # not yet gateable are classified EXEMPT with a stated reason in the
    # companion sentinel rather than left silently unrun.
    name: skills-bats-tests
    runs-on: ubuntu-latest
    # Raised from 5 when the first skill-scoped files were gated: the suite
    # measured 253s locally then — 84% of a 5-minute budget, too thin to
    # absorb normal runner variance.
    #
    # Re-measured at 305s (88 files, 1308 cases, zero failures) after the
    # remaining clean-and-passing skill-scoped suites joined the invocation.
    #
    # Re-measured again when the last 23 skill-scoped suites were gated, taking
    # the invocation to 111 files / 1531 cases, zero failures. Measured
    # like-for-like on one machine: the 88-file set ran in 207s and the
    # 111-file set in 260s, a 26% increase. Applied to the 305s figure above
    # that projects to roughly 385s, about 64% of the 10-minute budget. The
    # budget is left at 10 minutes — still well clear of the projected run,
    # with enough margin for runner variance and still tight enough to catch a
    # genuine hang. Revisit if another batch of suites is added.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
      - uses: mig4/setup-bats@af9a00deb21b5d795cabfeaa8d9060410377686d  # v1.2.0
        with:
          bats-version: 1.10.0
      - name: Install jq, python3, and the YAML/JSON-schema backends
        # PyYAML/jsonschema must be present or the backend-guarded tests degrade
        # to a `skip`, which reports green — see the note in the bats-tests job.
        run: |
          sudo apt-get update && sudo apt-get install -y jq python3 python3-pip
          python3 -m pip install --break-system-packages PyYAML jsonschema
      - name: Run tests/skills bats coverage suite
        # Covers every bats file under tests/skills/ — at any depth — that
        # passes today and whose test names are free of internal identifiers.
        # Files not listed below are classified EXEMPT in the sentinel, each
        # with a stated reason. Every remaining exemption is assertion drift
        # in a legacy fixture at the top level of the tree, and repairing it is
        # tracked follow-on work; every skill-scoped suite one directory down
        # is now gated here.
        #
        # Paths are enumerated rather than globbed deliberately: bats is not
        # invoked recursively here, because a recursive invocation would pull
        # in the exempt suites and turn the job red.
        #
        # The companion regression sentinel
        # `tests/skills/E55-S11-plugin-ci-bats-coverage.bats` enumerates the
        # required-vs-exempt classification and FAILS this job if a file is
        # added to tests/skills/ without being classified, or if an entry is
        # silently un-wired from this list. Keep the bats invocation below
        # and the REQUIRED_FILES array in the sentinel byte-equal — drift
        # between them is the regression vector this step closes.
        run: |
          bats \
            tests/skills/E28-S227-td74-gaia-config-csv-cleanup.bats \
            tests/skills/E55-S11-plugin-ci-bats-coverage.bats \
            tests/skills/E69-S1-rename-map.bats \
            tests/skills/E69-S3-test-strategy-collapse.bats \
            tests/skills/bash32-portability-lint.bats \
            tests/skills/conditional-check-hints.bats \
            tests/skills/e28-s117-quick-dev-conversion.bats \
            tests/skills/e64-s3-transition-script-path-refs.bats \
            tests/skills/gaia-a11y-testing.bats \
            tests/skills/gaia-atdd-batch.bats \
            tests/skills/gaia-atdd.bats \
            tests/skills/gaia-ci-edit-hints.bats \
            tests/skills/gaia-config-ci-regenerate.bats \
            tests/skills/gaia-config-section-scope.bats \
            tests/skills/gaia-config-validate-schema.bats \
            tests/skills/gaia-config-yaml-editor.bats \
            tests/skills/gaia-deploy-adapter-dispatch.bats \
            tests/skills/gaia-deploy-checklist.bats \
            tests/skills/gaia-deploy-failures.bats \
            tests/skills/gaia-deploy-post.bats \
            tests/skills/gaia-deploy.bats \
            tests/skills/gaia-dev-story-e41-s3-yolo-val-on-tdd-phases.bats \
            tests/skills/gaia-dev-story-planning-gate.bats \
            tests/skills/gaia-dev-story-step2b-atdd.bats \
