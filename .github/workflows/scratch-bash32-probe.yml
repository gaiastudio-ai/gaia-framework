name: scratch-bash32-probe
# Throwaway evidence job on the macOS runner (/bin/bash 3.2). Never merged.
on:
  pull_request:
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tools
        run: |
          brew list jq >/dev/null 2>&1 || brew install jq
          brew list bats-core >/dev/null 2>&1 || brew install bats-core; brew list yq >/dev/null 2>&1 || brew install yq
          jq --version; bats --version
      - name: Probe
        run: /bin/bash .github/scratch-probe/probe.sh 3afede94066c822728bbbd0f95cba3aacce2f34e e656a2919ad1bff42be7df27812d09f9a5052c25 999e74754a660bce874679f3461b8e348057f244
