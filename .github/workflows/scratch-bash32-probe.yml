name: scratch-bash32-probe
# Throwaway evidence job on the macOS runner (/bin/bash 3.2). Never merged.
on:
  pull_request:
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tools
        run: |
          brew list jq >/dev/null 2>&1 || brew install jq
          brew list bats-core >/dev/null 2>&1 || brew install bats-core; brew list yq >/dev/null 2>&1 || brew install yq; brew list mawk >/dev/null 2>&1 || brew install mawk; command -v mawk; awk --version 2>&1 | head -1 || true
          jq --version; bats --version
      - name: Probe
        run: /bin/bash .github/scratch-probe/probe.sh bc473a79b76c2dcc8b4876992537bfcc1a5efc40 25f8f0e8bdbdf249988882a97718ba32354b62aa 66e39ace44782f70402d2f9e174a060390ffd26b
