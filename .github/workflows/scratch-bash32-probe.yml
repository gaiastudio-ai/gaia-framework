name: scratch-bash32-probe
# Throwaway evidence job on the macOS runner (/bin/bash 3.2). Never merged.
on:
  pull_request:
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Tools
        run: |
          brew list jq >/dev/null 2>&1 || brew install jq
          brew list bats-core >/dev/null 2>&1 || brew install bats-core
          jq --version; bats --version
      - name: Probe
        run: /bin/bash .github/scratch-probe/probe.sh 0267ede4635a34f69d0d93f3de6713767d371e00 beac4f3ab336b3c877707ffb74229a7d54ed0f53 ed4195d912be683d3eeaf1dc8eadeb42d1e773e8
